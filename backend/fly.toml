# Fly.io configuration specification for Sift Backend
# Docs: https://fly.io/docs/reference/configuration/

app = "sift-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SIFT_ENV = "production"
  SIFT_PORT = "8000"
  SIFT_HOST = "0.0.0.0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
