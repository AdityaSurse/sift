name: Sift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Lint, Migrate & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sift_test
      SIFT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sift_test
      SIFT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sift_test
      SIFT_ENV: test
      GEMINI_API_KEY: dummy_gemini_api_key
      OPENAI_API_KEY: dummy_openai_api_key
      ANTHROPIC_API_KEY: dummy_anthropic_api_key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Lint backend code
        run: uv run ruff check .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
